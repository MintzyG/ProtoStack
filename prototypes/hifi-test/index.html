<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ProtoStack — Hi-Fi Prototype (Session 02)</title>
<style>
  :root {
    /* White-label brand tokens (swap here later for final brand) */
    --ps-accent: #38bdf8;
    --ps-accent-ink: #07131c;
    --ps-accent-soft: rgba(56, 189, 248, 0.14);

    /* Builder mode distinct accent */
    --ps-builder: #f59e0b;
    --ps-builder-ink: #1a1204;
    --ps-builder-soft: rgba(245, 158, 11, 0.14);

    /* Wootility v5-inspired layered dark surfaces */
    --bg: #111316;
    --panel: #1a1c20;
    --card: #21242a;
    --card-hover: #282c34;
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.16);
    --ink: #f1f5f9;
    --muted: #8b95a7;
    --ok: #22c55e;
    --ok-soft: rgba(34, 197, 94, 0.14);
    --warn: #f59e0b;
    --warn-soft: rgba(245, 158, 11, 0.14);
    --radius: 12px;
    --font: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  body.builder-mode {
    --ps-accent: var(--ps-builder);
    --ps-accent-ink: var(--ps-builder-ink);
    --ps-accent-soft: var(--ps-builder-soft);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 13.5px;
    -webkit-font-smoothing: antialiased;
  }

  button, input, select { font-family: inherit; }

  /* ===== ENTRY SCREEN (WOOTILITY STYLE) ===== */
  .entry-wrap {
    min-height: 680px;
    display: flex;
    flex-direction: column;
    padding: 24px 32px;
  }
  .entry-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo-mark {
    width: 36px;
    height: 36px;
    border-radius: 9px;
    border: 1.5px dashed var(--border-strong);
    display: grid;
    place-items: center;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
  }
  .entry-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    text-align: center;
    max-width: 560px;
    margin: 0 auto;
    padding: 40px 0;
  }
  .entry-center h1 {
    margin: 0;
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.025em;
  }
  .entry-center p {
    margin: 0;
    color: var(--muted);
    font-size: 14.5px;
    line-height: 1.55;
  }
  .entry-btns {
    display: flex;
    gap: 12px;
    margin-top: 6px;
  }
  .entry-preview {
    margin-top: 22px;
    opacity: 0.7;
    width: 340px;
    height: 92px;
    border-radius: 16px;
    background: #090b0e;
    border: 1px solid var(--border);
    padding: 8px;
  }
  .entry-preview canvas { width: 100%; height: 100%; image-rendering: pixelated; border-radius: 10px; }

  /* ===== MAIN WOOTILITY V5 WORKBENCH ===== */
  .workbench {
    display: none;
    min-height: 680px;
    grid-template-columns: 74px 256px 1fr;
    gap: 0;
  }
  .workbench.open { display: grid; }
  .workbench.collapsed { grid-template-columns: 74px 0px 1fr; }

  /* 1. Far-Left Narrow Icon Rail */
  .rail {
    padding: 18px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    background: var(--bg);
  }
  .rail-item {
    width: 58px;
    padding: 9px 4px;
    border-radius: 10px;
    border: 0;
    background: transparent;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.14s, color 0.14s;
  }
  .rail-item svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  .rail-item:hover { background: var(--panel); color: var(--ink); }
  .rail-item.active { background: var(--panel); color: var(--ps-accent); }

  /* 2. Floating Rounded Secondary Sidebar */
  .sidebar-wrap {
    padding: 14px 0 14px 4px;
    overflow: hidden;
  }
  .sidebar {
    height: 100%;
    min-height: 650px;
    background: var(--panel);
    border-radius: 14px;
    padding: 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    border: 1px solid var(--border);
  }
  .sb-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 2px;
  }
  .sb-title { font-size: 14px; font-weight: 650; letter-spacing: -0.01em; }
  .icon-btn {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 0;
    background: transparent;
    color: var(--muted);
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  .icon-btn:hover { background: var(--card); color: var(--ink); }
  .icon-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .icon-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.9; }

  /* Device Switcher Card (Wootility style — dropdown, never accidental disconnect!) */
  .dev-wrap { position: relative; }
  .dev-card {
    width: 100%;
    padding: 10px 11px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.14s, background 0.14s;
  }
  .dev-card:hover { border-color: var(--border-strong); background: var(--card-hover); }
  .dev-thumb {
    width: 44px;
    height: 28px;
    border-radius: 6px;
    background: #0a0c10;
    border: 1px solid var(--border);
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }
  .dev-thumb-dots {
    display: flex;
    gap: 4px;
  }
  .dev-thumb-dots span {
    width: 12px;
    height: 6px;
    border-radius: 2px;
    background: var(--ps-accent);
    opacity: 0.85;
  }
  .dev-info { flex: 1; min-width: 0; }
  .dev-sub { font-size: 10.5px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .dev-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--warn); }
  .dev-dot.live { background: var(--ok); }
  .dev-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dev-menu {
    position: absolute;
    left: 0;
    right: 0;
    top: calc(100% + 6px);
    background: var(--card);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    padding: 6px;
    display: none;
    flex-direction: column;
    gap: 2px;
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.55);
    z-index: 30;
  }
  .dev-menu.open { display: flex; }
  .dev-menu button {
    width: 100%;
    text-align: left;
    padding: 8px 10px;
    border-radius: 7px;
    border: 0;
    background: transparent;
    color: var(--ink);
    font-size: 12.5px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .dev-menu button:hover { background: var(--card-hover); }
  .dev-menu .sep { height: 1px; background: var(--border); margin: 4px 2px; }

  .sb-section {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    padding: 4px 8px 2px;
    letter-spacing: 0.02em;
  }
  .sb-nav {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .sb-btn {
    height: 38px;
    padding: 0 11px;
    border-radius: 9px;
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    transition: background 0.12s, color 0.12s;
  }
  .sb-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; flex-shrink: 0; }
  .sb-btn:hover { background: rgba(255,255,255,0.04); color: var(--ink); }
  .sb-btn.active { background: var(--card-hover); color: var(--ink); font-weight: 600; }
  .sb-btn.active svg { color: var(--ps-accent); }
  .sb-foot {
    margin-top: auto;
    text-align: center;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    padding-top: 8px;
  }

  /* 3. Main Canvas Column */
  .canvas-col {
    padding: 14px 24px 36px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    max-width: 960px;
    width: 100%;
    margin: 0 auto;
  }

  /* Distinct Builder Banner (only shown in Builder micro-frontend!) */
  .builder-strip {
    display: none;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    border-radius: 10px;
    background: var(--ps-builder-soft);
    border: 1px solid rgba(245, 158, 11, 0.35);
    color: var(--ps-builder);
    font-size: 12px;
    font-weight: 600;
  }
  body.builder-mode .builder-strip { display: flex; }

  /* Floating Top Action Pill Bar (Wootility v5 signature!) */
  .top-pill {
    height: 54px;
    padding: 0 12px 0 14px;
    border-radius: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .pill-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .profile-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    font-size: 13.5px;
  }
  .profile-icon {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: var(--ps-accent-soft);
    color: var(--ps-accent);
    display: grid;
    place-items: center;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
  }
  .status-pill {
    font-family: var(--mono);
    font-size: 11px;
    padding: 4px 9px;
    border-radius: 99px;
    background: var(--ok-soft);
    color: var(--ok);
  }
  .status-pill.dirty {
    background: var(--warn-soft);
    color: var(--warn);
  }
  .metric-pill {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--muted);
    padding: 4px 8px;
    border-radius: 7px;
    background: var(--card);
  }
  .metric-pill.warn { background: var(--warn-soft); color: var(--warn); }

  .pill-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Buttons (generous 36px+ hit targets!) */
  .btn {
    height: 36px;
    padding: 0 14px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: var(--card);
    color: var(--ink);
    font-size: 13px;
    font-weight: 550;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    transition: transform 0.08s, background 0.12s, border-color 0.12s, filter 0.12s;
  }
  .btn:hover { background: var(--card-hover); border-color: rgba(255,255,255,0.26); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
  .btn.primary {
    background: var(--ps-accent);
    color: var(--ps-accent-ink);
    border-color: transparent;
    font-weight: 650;
  }
  .btn.primary:hover { filter: brightness(1.08); background: var(--ps-accent); }
  .btn.pulse-saved {
    background: var(--ok) !important;
    color: #06180d !important;
  }

  /* Borderless Hero Visor Stage */
  .hero-stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 4px 0 2px;
  }
  .visor-shell {
    width: 100%;
    max-width: 620px;
    background: #080a0e;
    border-radius: 18px;
    padding: 12px;
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45), inset 0 0 0 1px rgba(255,255,255,0.08);
  }
  #visorCanvas {
    width: 100%;
    height: 150px;
    display: block;
    border-radius: 10px;
    background: #040608;
    image-rendering: pixelated;
  }
  .sim-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .sim-btn {
    height: 34px;
    padding: 0 13px;
    border-radius: 99px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--ink);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    user-select: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: transform 0.08s, border-color 0.12s, background 0.12s;
  }
  .sim-btn:hover { border-color: var(--ps-accent); background: var(--card); }
  .sim-btn.firing {
    background: var(--ps-accent);
    color: var(--ps-accent-ink);
    border-color: var(--ps-accent);
    transform: scale(0.95);
    font-weight: 650;
  }
  .sim-sub { font-size: 10.5px; opacity: 0.7; font-family: var(--mono); }

  /* View Section Header + Cards */
  .view-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .view-title {
    margin: 0;
    font-size: 18px;
    font-weight: 650;
    letter-spacing: -0.015em;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .help-q {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1px solid var(--border-strong);
    color: var(--muted);
    font-size: 11px;
    display: inline-grid;
    place-items: center;
    cursor: help;
    position: relative;
  }
  .help-q:hover::after {
    content: attr(data-tip);
    position: absolute;
    left: 50%;
    bottom: calc(100% + 8px);
    transform: translateX(-50%);
    width: 220px;
    padding: 8px 10px;
    border-radius: 8px;
    background: #0b0d11;
    border: 1px solid var(--border-strong);
    color: var(--ink);
    font-size: 11.5px;
    font-weight: 400;
    line-height: 1.4;
    z-index: 40;
    pointer-events: none;
    box-shadow: 0 10px 24px rgba(0,0,0,0.5);
  }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid-faces { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .card-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 14px;
    font-weight: 600;
  }

  /* Face Tiles */
  .face-tile {
    background: var(--panel);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 10px;
    color: var(--ink);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    transition: border-color 0.12s, background 0.12s, transform 0.08s;
  }
  .face-tile:hover { background: var(--card); border-color: var(--border-strong); }
  .face-tile:active { transform: scale(0.97); }
  .face-tile.active { border-color: var(--ps-accent); background: var(--ps-accent-soft); }
  .face-tile.dashed { border-style: dashed; color: var(--muted); }
  .face-tile svg { width: 58px; height: 28px; stroke: currentColor; fill: none; stroke-width: 2.3; stroke-linecap: round; }
  .face-tile span { font-size: 12.5px; font-weight: 550; }

  /* Tint Swatches (real vivid colors!) */
  .swatch-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .swatches { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .swatch {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .swatch:hover { transform: scale(1.1); }
  .swatch.active { border-color: #ffffff; box-shadow: 0 0 0 2px rgba(255,255,255,0.22); }

  /* Tactile Wootility Toggle Switch */
  .toggle {
    width: 44px;
    height: 24px;
    border-radius: 99px;
    border: 1px solid var(--border-strong);
    background: var(--card);
    position: relative;
    cursor: pointer;
    padding: 0;
    transition: background 0.15s, border-color 0.15s;
  }
  .toggle::after {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--muted);
    transition: transform 0.15s, background 0.15s;
  }
  .toggle.on { background: var(--ps-accent-soft); border-color: var(--ps-accent); }
  .toggle.on::after { transform: translateX(20px); background: var(--ps-accent); }

  /* Controls */
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .muted { color: var(--muted); font-size: 12.5px; }
  .mono { font-family: var(--mono); font-size: 12px; }

  input[type="range"] {
    width: 100%;
    height: 26px;
    accent-color: var(--ps-accent);
    cursor: pointer;
  }
  select {
    height: 38px;
    padding: 0 12px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: var(--card);
    color: var(--ink);
    font-size: 13px;
    cursor: pointer;
  }

  /* Live Meter */
  .meter {
    height: 14px;
    border-radius: 99px;
    background: #0c0e12;
    border: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  .meter-fill { height: 100%; background: var(--ps-accent); transition: width 0.1s ease, background 0.12s; }
  .meter-cut { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--warn); }

  /* Interactive Paw Button Key Strip (Wootility Mod-Tap style!) */
  .paw-strip {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .paw-key {
    min-width: 124px;
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--panel);
    color: var(--ink);
    text-align: left;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: border-color 0.12s, background 0.12s;
  }
  .paw-key:hover { background: var(--card); border-color: var(--border-strong); }
  .paw-key.active { border-color: var(--ps-accent); background: var(--ps-accent-soft); }
  .paw-key-head { display: flex; justify-content: space-between; align-items: center; font-weight: 650; font-size: 13px; }
  .paw-bind { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .paw-bind strong { color: var(--ink); font-weight: 600; }

  /* Segmented control */
  .seg {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .seg button {
    height: 36px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 550;
    cursor: pointer;
  }
  .seg button.active { background: var(--ps-accent); color: var(--ps-accent-ink); border-color: transparent; font-weight: 650; }

  /* Big 40px stepper for Builder wiring */
  .stepper { display: inline-flex; align-items: center; gap: 10px; }
  .step-btn {
    width: 40px;
    height: 40px;
    border-radius: 9px;
    border: 1px solid var(--border-strong);
    background: var(--card);
    color: var(--ink);
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
  }
  .step-btn:hover { background: var(--card-hover); border-color: var(--ps-accent); }
  .step-btn:active { transform: scale(0.95); }
  .step-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .alert {
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 12px;
    background: var(--warn-soft);
    border: 1px solid rgba(245, 158, 11, 0.35);
    color: var(--warn);
  }
  .alert.ok {
    background: var(--ok-soft);
    border-color: rgba(34, 197, 94, 0.35);
    color: var(--ok);
  }

  /* Toast notification (top-right, Wootility style) */
  .toast-stack {
    position: fixed;
    top: 18px;
    right: 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 60;
    pointer-events: none;
  }
  .toast {
    padding: 10px 14px;
    border-radius: 10px;
    background: var(--card);
    border: 1px solid var(--ok);
    color: var(--ink);
    font-size: 12.5px;
    font-weight: 550;
    box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    display: flex;
    align-items: center;
    gap: 8px;
    animation: toastIn 0.16s ease;
  }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

  /* Modal */

</style>

<script>
// ===== POSTHOG-STYLE SESSION RECORDER =====
const SESSION_ID = "hifi02_" + new Date().toISOString().replace(/[:.]/g, "-");
const SESSION_START = performance.now();
const events = [];
let recentClicks = [];
let viewEnteredAt = performance.now();
let currentView = "config/entry";
let hesitationTimer = null;

function track(eventName, props = {}) {
  const entry = {
    session_id: SESSION_ID,
    ts: new Date().toISOString(),
    t_ms: Math.round(performance.now() - SESSION_START),
    view: currentView,
    event: eventName,
    ...props
  };
  events.push(entry);
  document.getElementById("recCount").textContent = `REC ${events.length}`;
  try { localStorage.setItem("protostack_hifi02_events", JSON.stringify(events)); } catch (_) {}
  if (location.hostname === "127.0.0.1" || location.hostname === "localhost") {
    fetch("/api/track", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(entry)
    }).catch(() => {});
  }
  clearTimeout(hesitationTimer);
  hesitationTimer = setTimeout(() => track("hesitation", { idle_ms: 8000 }), 8000);
}

document.addEventListener("click", (e) => {
  if (e.target.closest(".rec-dock")) return;
  const interactive = e.target.closest("button, input, select, a, label, [role=button]");
  const now = performance.now();
  const pt = { t: now, x: Math.round(e.clientX), y: Math.round(e.clientY) };
  recentClicks = recentClicks.filter(c => now - c.t < 800);
  recentClicks.push(pt);
  if (recentClicks.filter(c => Math.hypot(c.x - pt.x, c.y - pt.y) < 40).length >= 3) {
    track("rage_click", { x: pt.x, y: pt.y, target: interactive?.dataset?.track || interactive?.id || e.target.tagName });
    recentClicks = [];
  }
  track(interactive ? "$click" : "dead_click", {
    x: pt.x, y: pt.y,
    tag: (interactive || e.target).tagName,
    track_key: interactive?.dataset?.track || null,
    label: (interactive || e.target).textContent.trim().replace(/\s+/g, " ").slice(0, 36)
  });
}, true);

document.getElementById("exportRecBtn").onclick = () => {
  track("session_finish", { total_events: events.length, duration_ms: Math.round(performance.now() - SESSION_START) });
  const blob = new Blob([events.map(e => JSON.stringify(e)).join("\n") + "\n"], { type: "application/x-ndjson" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `${SESSION_ID}.jsonl`; a.click();
  URL.revokeObjectURL(url);
};

// ===== TOAST FEEDBACK =====
function toast(msg) {
  const stack = document.getElementById("toastStack");
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<span style="color:var(--ok)">✓</span><span>${msg}</span>`;
  stack.appendChild(el);
  setTimeout(() => el.remove(), 2200);
}

// ===== STATE =====
const INITIAL = {
  face: "Idle",
  color: "#38bdf8",
  mirror: true,
  brightness: 80,
  limitA: 3.0,
  fan: 65,
  boopOn: true,
  boopCm: 5,
  boopFace: "Blush",
  boopSec: 3,
  paws: [
    { id: 1, pin: 14, tap: "Happy", hold: "Blush", holdMs: 500 },
    { id: 2, pin: 15, tap: "Angry", hold: "Sleepy", holdMs: 500 },
    { id: 3, pin: 16, tap: "Cycle", hold: "Starry", holdMs: 500 }
  ],
  customFaces: [],
  preset: "SmartLED V5",
  driver: "FM6126A",
  order: "RGB",
  boopHw: "APDS9960 (I2C)"
};

let factory = structuredClone(INITIAL);
let saved = structuredClone(INITIAL);
let state = structuredClone(INITIAL);
let undoStack = [];
let redoStack = [];

let site = "config"; // config | builder
let railMode = "visor"; // visor | settings (in config)
let tab = "faces";
let usb = false;
let devMenuOpen = false;
let selectedPawId = 1;
let boopLiveCm = 14;
let boopOverrideUntil = 0;
let identifyPanel = 0;
let identifyUntil = 0;
let flashPct = 0;
let flashing = false;
let scanResult = null;
let firingChip = null;

const SWATCHES = ["#38bdf8", "#34d399", "#f472b6", "#fbbf24", "#a78bfa", "#f87171", "#f8fafc"];

function allFaces() {
  return ["Idle", "Happy", "Blush", "Angry", "Sleepy", "Starry", ...state.customFaces];
}

function isDirty() {
  return JSON.stringify(state) !== JSON.stringify(saved);
}

function mutate(fn, evt, props) {
  undoStack.push(structuredClone(state));
  if (undoStack.length > 30) undoStack.shift();
  redoStack = [];
  fn();
  if (evt) track(evt, props);
  render();
}

function setView(newSite, newRail, newTab) {
  const prev = currentView;
  const dur = Math.round(performance.now() - viewEnteredAt);
  site = newSite;
  railMode = newRail;
  tab = newTab;
  devMenuOpen = false;
  document.body.classList.toggle("builder-mode", site === "builder");
  currentView = `${site}/${railMode === "settings" ? "settings" : tab}`;
  if (prev !== currentView) {
    track("$pageview", { from: prev, prev_dwell_ms: dur });
    viewEnteredAt = performance.now();
  }
  render();
}

function calcPower() {
  const raw = 0.35 + (state.brightness / 100) * 2.85;
  const capped = raw > state.limitA;
  const draw = Math.min(raw, state.limitA);
  const effScale = capped ? Math.max(0.15, (state.limitA - 0.35) / 2.85) : (state.brightness / 100);
  return { raw, draw, capped, effPct: Math.round(effScale * 100), effScale };
}

// ===== MODAL =====
function openModal(html, bind) {
  const bg = document.getElementById("modalBg");
  const box = document.getElementById("modalBox");
  box.innerHTML = html;
  bg.classList.add("open");
  if (bind) bind(box);
}
function closeModal() { document.getElementById("modalBg").classList.remove("open"); }
document.getElementById("modalBg").onclick = e => { if (e.target.id === "modalBg") closeModal(); };

function openUsbPicker(onConnect) {
  openModal(`
    <div class="card-title"><span>Connect USB Device</span><button class="icon-btn" id="mX">✕</button></div>
    <button class="dev-card" id="pickT41" data-track="webhid_pick_t41">
      <div class="dev-thumb"><div class="dev-thumb-dots"><span></span><span></span></div></div>
      <div class="dev-info">
        <div class="dev-sub"><span class="dev-dot live"></span>WebHID · Zero Drivers</div>
        <div class="dev-name">ProtoStack Visor (Teensy 4.1)</div>
      </div>
      <span class="mono" style="color:var(--ps-accent)">Connect</span>
    </button>
  `, (box) => {
    box.querySelector("#mX").onclick = closeModal;
    box.querySelector("#pickT41").onclick = () => {
      usb = true;
      track("usb_connected", { device: "Teensy 4.1" });
      closeModal();
      toast("Connected to Teensy 4.1 over WebHID");
      onConnect();
    };
  });
}

function enterWorkbench(withUsb) {
  usb = withUsb;
  document.getElementById("entryWrap").style.display = "none";
  document.getElementById("workbench").classList.add("open");
  setView("config", "visor", "faces");
}

document.getElementById("entrySimBtn").onclick = () => { track("enter_simulator"); enterWorkbench(false); };
document.getElementById("entryUsbBtn").onclick = () => openUsbPicker(() => enterWorkbench(true));

document.getElementById("exitBuilderBtn").onclick = () => {
  toast("Returned to Owner Config site");
  setView("config", "visor", "faces");
};

document.getElementById("undoBtn").onclick = () => {
  if (!undoStack.length) return;
  redoStack.push(structuredClone(state));
  state = undoStack.pop();
  track("undo");
  render();
};
document.getElementById("redoBtn").onclick = () => {
  if (!redoStack.length) return;
  undoStack.push(structuredClone(state));
  state = redoStack.pop();
  track("redo");
  render();
};

document.getElementById("saveBtn").onclick = () => {
  saved = structuredClone(state);
  undoStack = [];
  redoStack = [];
  track("save_committed", { usb });
  const btn = document.getElementById("saveBtn");
  btn.classList.add("pulse-saved");
  btn.textContent = "Saved ✓";
  toast(usb ? "Saved to Teensy 4.1 flash" : "Saved in simulator");
  render();
  setTimeout(() => {
    btn.classList.remove("pulse-saved");
    btn.textContent = "Save to Head";
  }, 1100);
};

// Trigger helpers
function fireBoop() {
  boopLiveCm = Math.max(1, state.boopCm - 2);
  firingChip = "boop";
  if (state.boopOn) {
    boopOverrideUntil = performance.now() + state.boopSec * 1000;
    toast(`Boop triggered -> ${state.boopFace} (${state.boopSec}s)`);
  } else {
    toast("Boop sensor is disabled");
  }
  track("sim_boop", { on: state.boopOn, face: state.boopFace });
  render();
  setTimeout(() => { firingChip = null; render(); }, 280);
  setTimeout(() => { boopLiveCm = 14; if (tab === "boop") render(); }, 900);
}

function firePaw(paw, gesture) {
  const act = gesture === "hold" ? paw.hold : paw.tap;
  firingChip = `paw_${paw.id}`;
  boopOverrideUntil = 0;
  if (act === "None") {
    toast(`Paw ${paw.id} (${gesture}): no action bound`);
  } else if (act === "Cycle") {
    const list = allFaces();
    state.face = list[(list.indexOf(state.face) + 1) % list.length];
    toast(`Paw ${paw.id} (${gesture}) -> ${state.face}`);
  } else {
    state.face = act;
    toast(`Paw ${paw.id} (${gesture}) -> ${act}`);
  }
  track("sim_paw", { paw: paw.id, gesture, action: act, result_face: state.face });
  render();
  setTimeout(() => { firingChip = null; render(); }, 280);
}

function faceMiniSvg(name) {
  const m = {
    Idle: `<path d="M10 12 Q18 7 26 12 Q18 16 10 12 Z"/><path d="M12 22 Q29 25 46 21"/>`,
    Happy: `<path d="M10 14 Q19 5 28 14"/><path d="M10 21 Q29 27 48 20"/>`,
    Blush: `<circle cx="19" cy="11" r="5"/><path d="M10 19 L12 23 M15 19 L17 23"/><path d="M24 22 Q29 26 34 22 Q39 26 44 22"/>`,
    Angry: `<path d="M10 8 L28 14 L12 15 Z"/><path d="M12 22 L20 19 L28 23 L36 19 L46 22"/>`,
    Sleepy: `<path d="M10 13 L26 13"/><path d="M36 6 L44 6 L36 13 L44 13"/><path d="M16 22 L42 22"/>`,
    Starry: `<path d="M19 4 L21 10 L27 12 L21 14 L19 20 L17 14 L11 12 L17 10 Z"/><path d="M14 23 Q29 26 44 21"/>`,
    "Cyber Heart": `<path d="M19 19 C12 14 10 7 15 6 C17 6 19 8 19 8 C19 8 21 6 23 6 C28 7 26 14 19 19 Z"/><path d="M14 24 Q29 26 44 22"/>`
  };

}

// ===== RENDER =====
function render() {
  // 1. Rail
  const rail = document.getElementById("rail");
  rail.innerHTML = `
    <div class="logo-mark">LOGO</div>
    ${site === "config" ? `
      <button class="rail-item ${railMode === "visor" ? "active" : ""}" id="railVisor" data-track="rail_visor">

        <span>Visor</span>
      </button>
      <button class="rail-item ${railMode === "settings" ? "active" : ""}" id="railSettings" data-track="rail_settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3h.1a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8v.1a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
        <span>Settings</span>
      </button>
    ` : `
      <button class="rail-item active" data-track="rail_builder">
        <svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        <span>Builder</span>
      </button>
    `}
  `;
  if (site === "config") {
    document.getElementById("railVisor").onclick = () => setView("config", "visor", tab === "settings" ? "faces" : tab);
    document.getElementById("railSettings").onclick = () => setView("config", "settings", "settings");
  }

  // 2. Sidebar
  const sb = document.getElementById("sidebar");
  const isCfg = site === "config";
  sb.innerHTML = `
    <div class="sb-head">

    </div>

    <div class="dev-wrap">

        <span style="color:var(--muted);font-size:11px">▾</span>
      </button>
      <div class="dev-menu ${devMenuOpen ? "open" : ""}" id="devMenu">
        <button id="dmConnect" data-track="dm_connect"><span>${usb ? "Reconnect / Switch USB..." : "Connect Teensy 4.1 (USB)"}</span><span class="mono" style="color:var(--ps-accent)">HID</span></button>
        ${usb ? `<button id="dmSim" data-track="dm_sim"><span>Switch to Simulator</span><span class="muted">Offline</span></button>` : ""}
        <div class="sep"></div>
        <button id="dmExit" data-track="dm_exit"><span style="color:var(--muted)">Back to Welcome Screen</span></button>
      </div>
    </div>

    ${isCfg && railMode === "visor" ? `
      <div class="sb-section">Display</div>
      <div class="sb-nav">
        <button class="sb-btn ${tab === "faces" ? "active" : ""}" data-tab="faces" data-track="nav_faces">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01M8 15c1.5 2 6.5 2 8 0"/></svg>

          <span>Firmware Flash</span>
        </button>
        <button class="sb-btn ${tab === "panels" ? "active" : ""}" data-tab="panels" data-track="nav_b_panels">

    };
    document.getElementById("id2").onclick = () => {
      identifyPanel = 2; identifyUntil = performance.now() + 2200;
      track("panel_identify", { panel: 2 }); toast("Flashing ▲ 2 on Panel 2 (Right)"); render();
      setTimeout(() => { identifyPanel = 0; render(); }, 2200);
    };
    return;
  }

  if (site === "builder" && tab === "wiring") {
    root.innerHTML = `
      <div class="view-head">
        <h2 class="view-title">Wired Inputs &amp; Bus Scan</h2>
        <button class="btn" id="scanBtn" data-track="scan_i2c">Scan I2C Bus</button>
      </div>
      <div class="card">
        <div class="row">
          <span class="muted">Boop Sensor</span>
          <select id="bHw" data-track="boop_hw">
            ${["APDS9960 (I2C)", "Digital Pin 21"].map(x => `<option ${state.boopHw === x ? "selected" : ""}>${x}</option>`).join("")}
          </select>
        </div>
        <div class="row">
          <span class="muted">Wired Paw Buttons (0–8)</span>
          <div class="stepper">
            <button class="step-btn" id="decP" data-track="paw_dec" ${state.paws.length <= 0 ? "disabled" : ""}>−</button>
            <span class="mono" style="min-width:24px;text-align:center;font-size:15px;font-weight:700">${state.paws.length}</span>
            <button class="step-btn" id="incP" data-track="paw_inc" ${state.paws.length >= 8 ? "disabled" : ""}>+</button>
          </div>
        </div>
        <div class="mono" style="color:var(--muted)">
          Pins: ${state.paws.map(p => `Paw ${p.id} (P${p.pin})`).join(" · ") || "None"}
        </div>
        ${scanResult ? `<div class="alert ok">${scanResult}</div>` : ""}
      </div>
    `;
    document.getElementById("bHw").onchange = e => mutate(() => { state.boopHw = e.target.value; }, "boop_hw_changed", { val: e.target.value });
    document.getElementById("decP").onclick = () => mutate(() => { state.paws.pop(); toast(`Paw buttons: ${state.paws.length}`); }, "paw_count_changed", { count: state.paws.length - 1 });
    document.getElementById("incP").onclick = () => mutate(() => {
      const n = state.paws.length + 1;
      state.paws.push({ id: n, pin: 13 + n, tap: "Cycle", hold: "None", holdMs: 500 });
      toast(`Added Paw ${n} on Pin ${13 + n}`);
    }, "paw_count_changed", { count: state.paws.length + 1 });
    document.getElementById("scanBtn").onclick = () => {
      scanResult = `0x39 APDS9960 [OK] · 0x40 INA219 [OK] · ${state.paws.length} Paw Pull-ups [OK]`;
      track("i2c_scanned", { paw_count: state.paws.length });
      toast("I2C Bus scan complete");
      render();
    };
  }
}

// Close device menu if clicking outside
document.addEventListener("click", () => {
  if (devMenuOpen) { devMenuOpen = false; render(); }
});

// ===== REAL-TIME DUAL 64x32 RGB LED MATRIX RENDERER =====
const mainCanvas = document.getElementById("visorCanvas");
const mainCtx = mainCanvas.getContext("2d");
const entryCanvas = document.getElementById("entryCanvas");
const entryCtx = entryCanvas.getContext("2d");

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (state.colorOrder === "RBG") return [r, b, g];
  if (state.colorOrder === "BGR") return [b, g, r];
  return [r, g, b];
}

function drawHalf(ctx, ox, flipX, face, t, rgb, scale) {
  const [r, g, b] = rgb.map(v => Math.round(v * scale));
  const mainCol = `rgb(${r},${g},${b})`;
  const pink = `rgb(${Math.round(255 * scale)},${Math.round(90 * scale)},${Math.round(155 * scale)})`;

  function px(x, y, col = mainCol) {
    const lx = flipX ? (63 - x) : x;
    if (lx < 0 || lx >= 64 || y < 0 || y >= 32) return;
    ctx.fillStyle = col;
    ctx.fillRect(ox + lx, y, 1, 1);
  }
  function rect(x, y, w, h, col = mainCol) {
    for (let dy = 0; dy < h; dy++) for (let dx = 0; dx < w; dx++) px(x + dx, y + dy, col);
  }

  const blinking = (face === "Idle" || face === "Sleepy") && (t % 3.6) > 3.42;

  if (face === "Idle") {
    if (blinking) rect(18, 12, 18, 2);
    else { rect(18, 7, 18, 2); rect(16, 9, 22, 3); rect(18, 12, 18, 2); rect(22, 14, 10, 1); }
    rect(26, 23, 24, 2); rect(48, 21, 6, 2); rect(18, 22, 8, 2); rect(55, 16, 4, 2);
  } else if (face === "Happy") {
    const bnc = Math.round(Math.sin(t * 6) * 1);
    for (let i = 0; i < 18; i++) rect(17 + i, 13 - Math.round(Math.sin((i / 17) * Math.PI) * 6) + bnc, 2, 2);
    rect(18, 21, 34, 2); rect(15, 19, 4, 2); rect(50, 19, 5, 2); rect(24, 23, 22, 2); rect(55, 15, 4, 2);
  } else if (face === "Blush") {
    rect(20, 6, 14, 2); rect(18, 8, 18, 5); rect(20, 13, 14, 2); rect(22, 8, 3, 3, "#040608");
    const p = 0.65 + 0.35 * Math.sin(t * 7);
    const bc = `rgb(${Math.round(255 * scale * p)},${Math.round(85 * scale * p)},${Math.round(150 * scale * p)})`;
    for (let i = 0; i < 3; i++) rect(11 + i * 5, 17, 2, 4, bc);
    rect(34, 22, 8, 2); rect(42, 24, 6, 2); rect(48, 22, 8, 2); rect(55, 16, 4, 2);
  } else if (face === "Angry") {
    for (let i = 0; i < 18; i++) rect(17 + i, 7 + Math.floor(i * 0.38), 2, 3);
    rect(21, 13, 12, 2);
    for (let i = 0; i < 32; i += 6) { rect(18 + i, 22, 3, 2); rect(21 + i, 24, 3, 2); }
    rect(55, 16, 4, 2);
  } else if (face === "Sleepy") {
    rect(17, 12, 18, 2);
    if (!blinking) rect(20, 14, 12, 2);
    const zy = 4 + Math.round(Math.sin(t * 2.5) * 1);
    rect(6, zy, 5, 1); px(9, zy + 1); px(8, zy + 2); px(7, zy + 3); rect(6, zy + 4, 5, 1);
    rect(32, 23, 18, 2); rect(55, 17, 3, 2);
  } else if (face === "Starry") {
    const p = Math.sin(t * 8) > 0 ? 1 : 0;
    rect(25, 5 - p, 2, 11 + p * 2); rect(20 - p, 9, 12 + p * 2, 2); rect(23, 7, 6, 6);
    rect(20, 22, 32, 2); rect(50, 20, 4, 2); rect(55, 16, 4, 2);
  } else if (face === "Cyber Heart") {
    const bt = Math.sin(t * 7) > 0.2 ? 1 : 0;
    rect(20 - bt, 7, 5 + bt, 4, pink); rect(27, 7, 5 + bt, 4, pink);
    rect(19 - bt, 9, 14 + bt * 2, 3, pink); rect(21, 12, 10, 2, pink);
    rect(23, 14, 6, 2, pink); rect(25, 16, 2, 1, pink);
    rect(22, 22, 28, 2); rect(48, 20, 5, 2); rect(55, 16, 4, 2);
  }
}

function drawId(ctx, panel) {
  const ox = panel === 1 ? 0 : 64;
  ctx.fillStyle = "#0a2014";
  ctx.fillRect(ox + 1, 1, 62, 30);
  ctx.strokeStyle = "#22c55e";
  ctx.strokeRect(ox + 1.5, 1.5, 61, 29);
  ctx.fillStyle = "#22c55e";
  for (let i = 0; i < 7; i++) ctx.fillRect(ox + 20 - i, 7 + i, i * 2 + 1, 1);
  ctx.fillRect(ox + 19, 14, 3, 10);
  if (panel === 1) {
    ctx.fillRect(ox + 40, 8, 3, 16); ctx.fillRect(ox + 37, 10, 3, 2); ctx.fillRect(ox + 37, 22, 9, 2);
  } else {
    ctx.fillRect(ox + 36, 8, 10, 2); ctx.fillRect(ox + 44, 10, 2, 5); ctx.fillRect(ox + 36, 15, 10, 2);
    ctx.fillRect(ox + 36, 17, 2, 5); ctx.fillRect(ox + 36, 22, 10, 2);
  }
}

function renderCanvas(ctx, now, face, rgb, scale, showId) {
  const t = now / 1000;
  ctx.fillStyle = "#040608";
  ctx.fillRect(0, 0, 128, 32);
  ctx.fillStyle = "rgba(255,255,255,0.08)";
  ctx.fillRect(63, 0, 2, 32);
  if (showId && now < identifyUntil && identifyPanel > 0) {
    drawId(ctx, identifyPanel);
  } else {
    drawHalf(ctx, 0, false, face, t, rgb, scale);
    drawHalf(ctx, 64, state.mirror, face, t, rgb, scale);
  }
}

function loop(now) {
  const pwr = calcPower();
  const activeFace = (now < boopOverrideUntil) ? state.boopFace : state.face;
  const rgb = hexToRgb(state.color);
  renderCanvas(mainCtx, now, activeFace, rgb, pwr.effScale, true);
  renderCanvas(entryCtx, now, "Idle", [56, 189, 248], 0.8, false);
  requestAnimationFrame(loop);
}

track("session_start", { prototype: "hifi-v2-wootility", viewport: `${window.innerWidth}x${window.innerHeight}` });
requestAnimationFrame(loop);
</script>
